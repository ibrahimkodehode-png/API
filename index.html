<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>European Expenses CLI</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="javascript.js" defer></script>
  </head>

  <body>
    <!-- TERMINAL HEADER -->
    <header class="terminal-header">
      <span>EU-EXPENSES v1.0</span>
      <span class="blink">█</span>
    </header>

    <!-- NAVBAR -->
    <nav class="terminal-nav">
      <span class="prompt">$ select-region</span>
      <ul class="nav-links" id="nav-links"></ul>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <p>
        <span class="prompt">$</span> European Expense Generator<br />
        Compare cost of living, rent, groceries and salaries across Europe.
      </p>
    </section>

    <!-- DASHBOARD -->
    <main class="dashboard">
      <!-- LEFT -->
      <section class="terminal-panel">
        <div id="country1" class="terminal-box">
          <span class="prompt">$</span> select first country
        </div>

        <div id="country2" class="terminal-box">
          <span class="prompt">$</span> select second country
        </div>
      </section>

      <!-- RIGHT -->
      <section class="terminal-panel">
        <canvas id="comparisonChart"></canvas>
      </section>
    </main>

    <footer class="terminal-footer">
      <span>exit</span>
    </footer>
  </body>
</html>
