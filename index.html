<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>European Expenses</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="#" class="logo">European Expenses</a>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="nav-links" id="nav-links">
        <!-- Dynamic Country List (will be filled by JavaScript) -->
      </ul>
    </nav>

    <main>
      <!-- HERO SECTION -->
      <section class="hero">
        <div class="hero-content">
          <h1>Compare European Living Costs</h1>
          <p>
            Explore cost of living, rent, groceries, and salary data for
            European countries.
          </p>
          <button id="explore-btn">Explore Countries</button>
        </div>
      </section>

      <!-- DATA SECTION -->
      <section class="data-section">
        <div id="country-data">
          <div id="country1-data" class="card">
            <h3>Select a country to compare</h3>
          </div>
          <div id="country2-data" class="card">
            <h3>Select a second country to compare</h3>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <p>&copy; 2024 European Expenses. All rights reserved.</p>
    </footer>
  </body>
</html>
