<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>European Expenses</title>
    <meta
      name="description"
      content="Compare European living costs, rent, groceries, and salaries across countries."
    />
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="#" class="logo">European Expenses</a>

      <div class="hamburger" id="hamburger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="nav-links" id="nav-links"></ul>
    </nav>

    <main>
      <!-- COUNTRY DATA (NOW UNDER NAVBAR) -->
      <section class="data-section top-section">
        <div id="country-data">
          <div id="country1-data" class="card">
            <h3>Select a country to compare</h3>
          </div>

          <div id="country2-data" class="card">
            <h3>Select a second country to compare</h3>
          </div>
        </div>

        <button id="reset-btn" class="reset-btn">Reset Comparison</button>
      </section>

      <!-- HERO SECTION -->
      <section class="hero">
        <div class="hero-content">
          <h1>Compare European Living Costs</h1>
          <p>
            Explore cost of living, rent, groceries, and salary data for
            European countries.
          </p>
          <button id="explore-btn">Explore Countries</button>
        </div>
      </section>
    </main>

    <footer>
      <p>
        &copy; <span id="year"></span> European Expenses. All rights reserved.
      </p>
    </footer>
  </body>
</html>
